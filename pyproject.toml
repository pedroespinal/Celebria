[tool.flet]
app_id       = "com.pedroespinal.celebria"
product_name = "Celebria"
description  = "Recordatorio personal de cumpleanos / Personal birthday reminder"
version      = "1.0.0"
build_number = 1

[tool.flet.android]
adaptive_icon_background = "#07071a"
min_sdk_version          = 24
target_sdk_version       = 35
icon                     = "assets/icon.png"
permissions              = [
  "android.permission.POST_NOTIFICATIONS",
  "android.permission.RECEIVE_BOOT_COMPLETED",
  "android.permission.VIBRATE",
  "android.permission.WAKE_LOCK",
]
