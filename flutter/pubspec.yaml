name: celebria
description: "Celebria — Recordatorio de Cumpleanos"
publish_to: 'none'

version: 1.9.3+10903

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Data
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Notifications
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^3.0.0
  timezone: ^0.10.0

  # State management
  provider: ^6.1.2

  # Sound
  audioplayers: ^6.1.0

  # Files (photo pick, JSON/VCF import-export)
  file_picker: ^8.1.6

  # Links (WhatsApp, GitHub releases)
  url_launcher: ^6.3.1

  # Update checker
  http: ^1.2.2

  # Date/month formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/birthday.wav

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  min_sdk_android: 24
